<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perfumes San Pla: tienda de decants</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2fa;--card:#fff;--ink:#1b1340;--mut:#6b6488;--line:#dcd6ee;--pink:#e8336d;--gold:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120d2b;--card:#1d1745;--ink:#f4f2fa;--mut:#a9a2c8;--line:#322a63}}
:root[data-theme="dark"]{--bg:#120d2b;--card:#1d1745;--ink:#f4f2fa;--mut:#a9a2c8;--line:#322a63}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;padding-bottom:90px}
header{background:#1b1340;color:#fff;padding:26px 18px 22px;text-align:center}
header h1{margin:0;font-size:32px;line-height:1.05;font-weight:800}
header p{margin:8px 0 0;font-size:16px;opacity:.85}
.promo{background:var(--pink);color:#fff;text-align:center;font-weight:800;padding:10px 14px;font-size:18px}
main{max-width:760px;margin:0 auto;padding:16px 12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card svg{align-self:center;color:var(--ink)}
.card h2{margin:0;font-size:18px;font-weight:800}
.card .fam{font-size:13px;color:var(--mut);font-weight:500}
.card .nt{font-size:14px;color:var(--mut);line-height:1.3;flex:1}
.chips{display:flex;gap:6px}
.chip{flex:1;padding:7px 0;border-radius:999px;border:1.5px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.price{font-size:22px;font-weight:800}
button{font:inherit;cursor:pointer}
.add{border:0;border-radius:12px;padding:10px;background:var(--pink);color:#fff;font-weight:800;font-size:16px}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
footer{text-align:center;color:var(--mut);padding:8px 16px 24px;font-size:15px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:none;z-index:5}
#bar button{width:100%;max-width:760px;display:block;margin:0 auto;border:0;border-radius:14px;padding:14px;background:#1b1340;color:#fff;font-weight:800;font-size:17px}
#sheet{position:fixed;inset:0;z-index:9;background:rgba(10,6,30,.6);display:none;align-items:flex-end}
#sheet.on{display:flex}
#panel{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto}
#panel h2{margin:0 0 10px;font-size:22px;font-weight:800}
.ln{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ln span{flex:1;font-weight:500}
.q{display:flex;align-items:center;gap:8px}
.q button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--ink);font-size:18px;font-weight:800}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:17px}
.tot.big{font-size:24px;font-weight:800}
.save{color:var(--pink);font-weight:800}
#wa{display:block;text-align:center;text-decoration:none;margin-top:12px;padding:14px;border-radius:14px;background:#1f9d55;color:#fff;font-weight:800;font-size:17px}
.sec{display:flex;gap:10px;margin-top:10px}
.sec button{flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:none;color:var(--ink);font-weight:500}
.sizes{margin:0 0 16px;display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px;color:#1b1340}.sizes img{height:120px;width:auto;border-radius:8px}.sizes figcaption{font-size:15px;line-height:1.4}
.ph{height:170px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:12px;padding:6px}.ph img{max-height:100%;max-width:100%;width:auto;height:auto}
.old{font-size:14px;font-weight:500;color:var(--mut)}.bf{font-size:12px;font-weight:800;background:var(--gold);color:#1b1340;border-radius:6px;padding:2px 6px;vertical-align:middle}
</style>
</head>

function phHtml(p){return '<img src="'+p.i+'" alt="'+p.n+'">'}
function priceHtml(p,s){return money(p.p[s])+(p.o&&p.o[s]?' <s class="old">'+money(p.o[s])+'</s> <span class="bf">Buen Fin</span>':"")}
function byId(id){return P.filter(function(p){return p.id===id})[0]}
var $=function(i){return document.getElementById(i)},sel={},cart={};
var money=function(n){return "$"+n.toFixed(2).replace(/\.00$/,"")};
function vial(c){return '<svg viewBox="0 0 60 90" width="54" height="80" aria-hidden="true"><rect x="22" y="4" width="16" height="12" rx="3" fill="#1b1340"/><rect x="14" y="16" width="32" height="68" rx="8" fill="none" stroke="currentColor" stroke-width="3"/><rect x="17" y="42" width="26" height="39" rx="5" fill="'+c+'"/></svg>'}
function grid(){
  $("grid").innerHTML=P.map(function(p){sel[p.id]=5;return '<article class="card"><div class="ph" id="ph-'+p.id+'">'+phHtml(p,5)+'</div><div><h2>'+p.n+'</h2><div class="fam">'+p.f+'</div></div><div class="nt">'+p.t+'</div><div class="chips" data-id="'+p.id+'">'+[5,10].map(function(s){return '<button class="chip" data-s="'+s+'" aria-pressed="'+(s===5)+'">'+s+' ml</button>'}).join("")+'</div><div class="price" id="pr-'+p.id+'">'+priceHtml(p,5)+'</div><button class="add" data-add="'+p.id+'">Agregar</button></article>'}).join("");
}
function calc(){
  var u=[],n=0;
  Object.keys(cart).forEach(function(k){var s=+k.split("|")[1];for(var i=0;i<cart[k];i++){u.push(byId(k.split("|")[0]).p[s]);n++}});
  u.sort(function(a,b){return b-a});
  var full=0,pay=0;u.forEach(function(v,i){full+=v;if(i%2===0)pay+=v});
  return {n:n,full:full,pay:pay,save:full-pay};
}
function name(id){return P.filter(function(p){return p.id===id})[0].n}
function ui(){
  var c=calc();
  $("bar").style.display=c.n?"block":"none";
  $("open").textContent="Ver pedido ("+c.n+") - "+money(c.pay);

  var keys=Object.keys(cart);

  $("panel").innerHTML='<h2>Tu pedido</h2>'+keys.map(function(k){var a=k.split("|");return '<div class="ln"><span>'+name(a[0])+', '+a[1]+' ml</span><div class="q"><button data-m="'+k+'" aria-label="Quitar uno">-</button><b>'+cart[k]+'</b><button data-p="'+k+'" aria-label="Agregar uno">+</button></div></div>'}).join("")+
  '<div class="tot"><span>Subtotal</span><span>'+money(c.full)+'</span></div>'+
  (c.save?'<div class="tot save"><span>Promo 2x1</span><span>-'+money(c.save)+'</span></div>':'<div class="tot"><span>Agrega otro decant y paga solo el de mayor precio</span></div>')+
  '<div class="tot big"><span>Total</span><span>'+money(c.pay)+'</span></div>'+
  '<a id="wa" href="https://wa.me/'+WA+'?text='+msg+'" target="_blank" rel="noopener">Enviar pedido por WhatsApp</a>'+
  '<div class="sec"><button id="close">Seguir comprando</button><button id="clr">Vaciar</button></div>';
}
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.classList.contains("chip")){var id=t.parentNode.dataset.id;sel[id]=+t.dataset.s;[].forEach.call(t.parentNode.children,function(b){b.setAttribute("aria-pressed",b===t)});$("pr-"+id).innerHTML=priceHtml(byId(id),sel[id])}
  else if(t.dataset.add){var k=t.dataset.add+"|"+sel[t.dataset.add];cart[k]=(cart[k]||0)+1;t.textContent="Agregado";setTimeout(function(){t.textContent="Agregar"},900);ui()}
  else if(t.id==="open"){$("sheet").classList.add("on");ui()}
  else if(t.id==="close"||t.id==="sheet"){$("sheet").classList.remove("on")}
  else if(t.id==="clr"){cart={};$("sheet").classList.remove("on");ui()}
  else if(t.dataset.p){cart[t.dataset.p]++;ui()}
  else if(t.dataset.m){if(--cart[t.dataset.m]<=0)delete cart[t.dataset.m];ui()}
});
grid();
</script>
</body>
